# Release pipeline: pushing a tag such as v0.1.0 builds static binaries for
# x86_64 and aarch64, attests their provenance and publishes a GitHub Release
# with SHA256SUMS. install.sh downloads these assets.
#
#   git tag -a v0.1.0 -m "wtop 0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and (re)publish, e.g. v0.1.0 (0.1.0 also works)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ALPINE_IMAGE: alpine:3.24

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Accepts "v0.1.0" or "0.1.0" from the manual form and checks the tag
      # exists before anything else, so a typo fails with a clear message.
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          raw=${INPUT_TAG:-$GITHUB_REF_NAME}
          raw=${raw//[[:space:]]/}
          tag="v${raw#v}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$raw' is not a release tag; use the form v1.2.3"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::Tag $tag does not exist. Create and push it first: git tag -a $tag -m \"wtop ${tag#v}\" origin/main && git push origin $tag"
            exit 1
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Tag must match CMakeLists.txt and CHANGELOG.md
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          commit=$(git rev-parse --short HEAD)
          move_hint="Move the tag to a commit that has the release setup: git tag -f -a $TAG -m \"wtop ${TAG#v}\" origin/main && git push --force origin $TAG"
          if [ ! -f CHANGELOG.md ] || [ ! -f .github/workflows/release.yml ]; then
            echo "::error::Tag $TAG points at $commit, which predates the release pipeline (no CHANGELOG.md or release.yml). $move_hint"
            exit 1
          fi
          version=$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt)
          echo "Tag $TAG at $commit, CMakeLists.txt version $version"
          if [ "v$version" != "$TAG" ]; then
            echo "::error file=CMakeLists.txt::Tag $TAG does not match project VERSION $version (commit $commit)"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section in CHANGELOG.md (commit $commit)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      ASSET: wtop-linux-${{ matrix.arch }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Alpine uses musl, which links cleanly into a fully static binary that
      # runs on any distribution. docker run is used instead of a job
      # container because JavaScript actions cannot run in Alpine on arm64.
      - name: Build, test and stage in Alpine (static, musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$ALPINE_IMAGE" sh -euxc '
            apk add --no-cache build-base cmake samurai linux-headers git
            cmake -S . -B build-release -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DWTOP_STATIC=ON \
              -DWTOP_BUILD_TESTS=ON
            cmake --build build-release --parallel
            ctest --test-dir build-release --output-on-failure
            cmake --install build-release --prefix /src/stage --strip
            chown -R "$(stat -c %u:%g /src)" /src/stage /src/build-release
          '

      - name: Verify the binary is static and runs
        run: |
          file stage/bin/wtop
          file stage/bin/wtop | grep -Eq "statically linked|static-pie linked"
          stage/bin/wtop --version
          stage/bin/wtop --snapshot 120x40 > /dev/null

      - name: Run on older distributions
        run: |
          for image in debian:11 ubuntu:20.04 almalinux:8; do
            echo "::group::$image"
            docker run --rm -v "$PWD/stage:/w:ro" "$image" /w/bin/wtop --version
            echo "::endgroup::"
          done

      - name: Package
        run: |
          mkdir -p "dist/$ASSET"
          cp -r stage/bin stage/share "dist/$ASSET/"
          cp LICENSE.md README.md CHANGELOG.md "dist/$ASSET/"
          tar -C dist --owner=0 --group=0 --numeric-owner \
            -czf "dist/$ASSET.tar.gz" "$ASSET"
          tar -tzf "dist/$ASSET.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: wtop-linux-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum wtop-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/wtop-linux-*.tar.gz

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/HEAD/install.sh | bash -s -- --ref $TAG
          \`\`\`

          Verify a download: \`sha256sum -c SHA256SUMS --ignore-missing\` and
          \`gh attestation verify wtop-linux-x86_64.tar.gz -R ${{ github.repository }}\`.
          EOF
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "wtop $VERSION" \
              --notes-file notes.md
          fi
